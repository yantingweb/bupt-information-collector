# 打分词表。改这个不用动代码，改完用 `python run.py scan byr --dump` 对着真实数据校。
#
# 计分方式：各组独立累加，同一组内多个词命中都算。
# 别名理解：
#   boost    = 正向词表 {关键词: 权重}
#   grad     = 届数：命中 own 加分，命中 other 扣分
#   exclude  = 直接排除
#   noise    = 命中一次扣 noise_cap 分

profile:
  own_grad: "29"          # 他自己的届
  other_grad_penalty: -8  # 命中别的届扣多少

thresholds:
  action_line: 12         # ≥ 此分进「要动手」
  archive_line: 3         # ≥ 此分才值得进 inbox，以下直接丢掉
  noise_cap: -6           # 每个噪声词扣的分

